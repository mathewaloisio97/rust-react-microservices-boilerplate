syntax = "proto3";

package email.v1;

/// Manages email affiliations, verification lifecycles, and staged email updates for user accounts.
service EmailService {
  /// Retrieves the current primary email state, verification status, and any pending unverified email change requests for a user.
  rpc GetEmail(GetEmailRequest) returns (GetEmailResponse);

  /// Initiates or updates an email change request, staging a new email address and dispatching a verification code.
  rpc SetEmail(SetEmailRequest) returns (SetEmailResponse);

  /// Bypasses the verification code flow to directly seed or provision a pre-verified primary email address (e.g., via trusted OAuth/OIDC providers).
  rpc SetVerifiedEmail(SetVerifiedEmailRequest) returns (SetVerifiedEmailResponse);

  /// Validates a short-lived verification code to finalize an email change or initial email confirmation.
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
}

/// Request payload to retrieve the email state of a target user.
message GetEmailRequest {
  /// The unique identifier (UUID v4/v7) of the target user account.
  string user_id = 1;
}

/// Current active email address and staged change details for a user account.
message GetEmailResponse {
  /// The user's currently active primary email address.
  string current_email = 1;

  /// Indicates whether the user's current primary email address has been verified.
  bool is_verified = 2;

  /// The new unverified email address staged for change, if an update flow is in progress; empty string if no update is pending.
  string pending_new_email = 3;

  /// The categorization of the pending verification lifecycle (e.g., "INITIAL_REGISTRATION", "ADDRESS_UPDATE", "RE_VERIFICATION").
  string verification_type = 4;
}

/// Request payload to initiate or update a user's primary email address.
message SetEmailRequest {
  /// The unique identifier (UUID v4/v7) of the target user requesting the email change.
  string user_id = 1;

  /// The new target email address to stage for verification and future account attachment.
  string new_email = 2;
}

/// Response payload following an email change initiation.
message SetEmailResponse {
  /// Operational outcome status string indicating the result of the request (e.g., "VERIFICATION_SENT", "NO_CHANGE_REQUIRED").
  string status = 1;
}

/// Request payload to directly seed a pre-verified primary email address for an account.
message SetVerifiedEmailRequest {
  /// The unique identifier (UUID v4/v7) of the target user account.
  string user_id = 1;

  /// The pre-verified email address extracted from a trusted identity provider to attach directly to the account.
  string email = 2;
}

/// Response payload following a direct verified email attachment request.
message SetVerifiedEmailResponse {
  /// Indicates whether the pre-verified email address was successfully attached to the user account.
  bool success = 1;
}

/// Request payload submitting a verification code to complete an email verification flow.
message VerifyEmailRequest {
  /// The unique identifier (UUID v4/v7) of the user account completing verification.
  string user_id = 1;

  /// The short-lived numeric or alphanumeric secret code sent to the pending email inbox.
  string code = 2;

  /// The target email address undergoing verification. Required alongside the user ID and code to prevent cross-account code spraying attacks.
  string email = 3;
}

/// Response payload following a verification attempt.
message VerifyEmailResponse {
  /// Indicates whether the verification code was valid and the email transition succeeded.
  bool success = 1;

  /// The newly active and verified primary email address attached to the account upon successful verification.
  string email_updated_to = 2;
}
