syntax = "proto3";

package identity.v1;

/// Manages the core identity of a user, including automated onboarding, OAuth
/// verification, and traditional email/password fallback.
service IdentityService {
  /// Authenticates a user via an external OAuth provider (creating them if new).
  rpc OAuthLogin(OAuthLoginRequest) returns (AuthResponse);

  /// Provisions a new user using a traditional email and password.
  rpc RegisterLocal(RegisterLocalRequest) returns (AuthResponse);

  /// Verifies a user's plaintext password against their stored Argon2id hash.
  rpc LoginLocal(LoginLocalRequest) returns (AuthResponse);

  /// Updates the email address associated with local credentials.
  rpc UpdateLocalEmail(UpdateLocalEmailRequest) returns (UpdateLocalEmailResponse);
}

message OAuthLoginRequest {
  /// The identity provider (e.g., 'google', 'apple', 'facebook').
  string provider = 1;

  /// The OIDC identity token or access token provided by the client's login flow.
  string id_token = 2;
}

message RegisterLocalRequest {
  string email = 1;
  string password = 2;
}

message LoginLocalRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  /// The UUIDv7 representing the user's unique YourApp identifier. Empty if validation fails.
  string user_id = 1;

  /// True if the credentials or token were verified successfully.
  bool valid = 2;
}

message UpdateLocalEmailRequest {
  /// The unique UUIDv7 identifier of the user.
  string user_id = 1;

  /// The new email address to bind to the local credential record.
  string new_email = 2;
}

message UpdateLocalEmailResponse {
  /// True if the email update was committed successfully.
  bool success = 1;
}
