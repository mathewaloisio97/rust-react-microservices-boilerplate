syntax = "proto3";

package identity.v1;

/// Manages the core identity of a user, including automated onboarding, OAuth
/// verification, and traditional email/password fallback.
service IdentityService {
  /// Authenticates a user via an external OAuth provider (creating them if new).
  rpc OAuthLogin(OAuthLoginRequest) returns (AuthResponse);

  /// Provisions a new user using a traditional email and password.
  rpc RegisterLocal(RegisterLocalRequest) returns (AuthResponse);

  /// Verifies a user's plaintext password against their stored Argon2id hash.
  rpc LoginLocal(LoginLocalRequest) returns (AuthResponse);

  /// Updates the email address associated with local credentials.
  rpc UpdateLocalEmail(UpdateLocalEmailRequest) returns (UpdateLocalEmailResponse);

  /// Retrieves a user's core identity profile, status, and access level.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  /// Transitions a user from PENDING to ACTIVE.
  rpc ActivateUser(ActivateUserRequest) returns (ActivateUserResponse);
}

/// Represents the authorization boundary and administrative privileges of a user.
enum AccessLevel {
  ACCESS_LEVEL_DEFAULT = 0;
  ACCESS_LEVEL_STAFF = 1;
  ACCESS_LEVEL_ADMIN = 2;
  ACCESS_LEVEL_SUPER_ADMIN = 3;
  ACCESS_LEVEL_SYSTEM = 4;
}

/// Represents the operational state and accessibility of the user's account.
enum UserStatus {
  /// Account created but pending initial verification (e.g., email confirmation).
  USER_STATUS_PENDING = 0;
  
  /// Normal operating status.
  USER_STATUS_ACTIVE = 1;
  
  /// Explicitly blocked from accessing gateway-protected endpoints.
  USER_STATUS_SUSPENDED = 2;
}

message OAuthLoginRequest {
  string provider = 1;
  string id_token = 2;
}

message RegisterLocalRequest {
  string email = 1;
  string password = 2;
}

message LoginLocalRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string user_id = 1;
  bool valid = 2;
}

message UpdateLocalEmailRequest {
  string user_id = 1;
  string new_email = 2;
}

message UpdateLocalEmailResponse {
  bool success = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  string user_id = 1;
  AccessLevel access_level = 2;
  UserStatus status = 3;
  string created_at = 4;
}

message ActivateUserRequest {
  string user_id = 1;
}

message ActivateUserResponse {
  bool success = 1;
}
