services:
  # ============================================================================
  # Infrastructure
  # ============================================================================
  postgres:
    image: postgres:17.4-alpine
    container_name: your_app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: your_app-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.22
    container_name: your_app-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    expose:
      - "1025"

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: your_app-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC endpoint
    expose:
      - "4317"

  # ============================================================================
  # Rust Microservices
  # ============================================================================
  identity:
    build: 
      context: .
      dockerfile: ./backend-services/Dockerfile
      args:
        CARGO_FEATURES: "local-dev"
    image: your_app-backend-workspace:latest
    container_name: your_app-identity
    restart: unless-stopped
    command: ["./your_app_identity"]
    env_file: .env
    expose:
      - "50051"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    image: your_app-backend-workspace:latest
    container_name: your_app-auth
    restart: unless-stopped
    command: ["./your_app_auth"]
    env_file: .env
    expose:
      - "50052"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  email:
    image: your_app-backend-workspace:latest
    container_name: your_app-email
    restart: unless-stopped
    command: ["./your_app_email"]
    env_file: .env
    expose:
      - "50053"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

  access_tokens:
    image: your_app-backend-workspace:latest
    container_name: your_app-tokens
    restart: unless-stopped
    command: ["./your_app_access_tokens"]
    env_file: .env
    expose:
      - "50054"
    depends_on:
      auth:
        condition: service_started

  human_verification:
    image: your_app-backend-workspace:latest
    container_name: your_app-hv
    restart: unless-stopped
    command: ["./your_app_human_verification"]
    env_file: .env
    expose:
      - "50055"

  gateway:
    image: your_app-backend-workspace:latest
    container_name: your_app-gateway
    restart: unless-stopped
    command: ["./your_app_gateway"]
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      identity:
        condition: service_started
      auth:
        condition: service_started
      email:
        condition: service_started
      access_tokens:
        condition: service_started
      human_verification:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
      jaeger:
        condition: service_started

volumes:
  pgdata:
  rabbitmq_data:
