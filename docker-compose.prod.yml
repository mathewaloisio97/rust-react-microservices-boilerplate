services:
  # ============================================================================
  # Infrastructure
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: your_app-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: your_app-rabbitmq-prod
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: your_app-jaeger-prod
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    expose:
      - "4317" # OTLP gRPC collector internal to bridge network
    # Note: Ports are intentionally not exposed to the public host network. 
    # Use an SSH tunnel (e.g. ssh -L 16686:localhost:16686) to view traces securely.

  caddy:
    image: caddy:2-alpine
    container_name: your_app-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_started
    command: caddy reverse-proxy --from api.your_app.online --to gateway:3000

  # ============================================================================
  # Rust Microservices
  # ============================================================================
  identity:
    image: your_app-backend:latest
    build: 
      context: .
      dockerfile: ./backend-services/Dockerfile
    container_name: your_app-identity-prod
    restart: unless-stopped
    command: ["./your_app_identity"]
    env_file: .env.prod
    expose:
      - "50051"
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    image: your_app-backend:latest
    container_name: your_app-auth-prod
    restart: unless-stopped
    command: ["./your_app_auth"]
    env_file: .env.prod
    expose:
      - "50052"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  email:
    image: your_app-backend:latest
    container_name: your_app-email-prod
    restart: unless-stopped
    command: ["./your_app_email"]
    env_file: .env.prod
    expose:
      - "50053"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  human_verification:
    image: your_app-backend:latest
    container_name: your_app-hv-prod
    restart: unless-stopped
    command: ["./your_app_human_verification"]
    env_file: .env.prod
    expose:
      - "50055"

  access_tokens:
    image: your_app-backend:latest
    container_name: your_app-tokens-prod
    restart: unless-stopped
    command: ["./your_app_access_tokens"]
    env_file: .env.prod
    expose:
      - "50054"
    depends_on:
      auth:
        condition: service_started

  gateway:
    image: your_app-backend:latest
    container_name: your_app-gateway-prod
    restart: unless-stopped
    command: ["./your_app_gateway"]
    env_file: .env.prod
    expose:
      - "3000"
    depends_on:
      identity:
        condition: service_started
      auth:
        condition: service_started
      email:
        condition: service_started
      access_tokens:
        condition: service_started
      human_verification:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  pgdata:
  rabbitmq_data:
  caddy_data:
  caddy_config:
